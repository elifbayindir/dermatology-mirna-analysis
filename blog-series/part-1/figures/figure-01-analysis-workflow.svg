<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Clinical miRNA analysis workflow</title>
  <desc id="desc">A five-step workflow from synthetic data generation to quality control, statistical analysis, sensitivity checks, and public outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <text x="800" y="62" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">From synthetic clinical data to a reproducible public case study</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(52 120)">
      <rect width="250" height="210" rx="22" fill="#ffffff"/>
      <circle cx="45" cy="46" r="23" fill="#dbeafe"/>
      <text x="45" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">1</text>
      <text x="28" y="94" font-size="23" font-weight="700" fill="#0f172a">Synthetic cohort</text>
      <text x="28" y="132" font-size="18" fill="#475569">Clinical + qPCR fields</text>
      <text x="28" y="163" font-size="18" fill="#475569">Fixed random seed</text>
      <text x="28" y="194" font-size="18" fill="#475569">No patient data</text>
    </g>

    <g transform="translate(365 120)">
      <rect width="250" height="210" rx="22" fill="#ffffff"/>
      <circle cx="45" cy="46" r="23" fill="#dcfce7"/>
      <text x="45" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#15803d">2</text>
      <text x="28" y="94" font-size="23" font-weight="700" fill="#0f172a">Quality checks</text>
      <text x="28" y="132" font-size="18" fill="#475569">Distributions + missingness</text>
      <text x="28" y="163" font-size="18" fill="#475569">Assay QC flags</text>
      <text x="28" y="194" font-size="18" fill="#475569">Reference stability</text>
    </g>

    <g transform="translate(678 120)">
      <rect width="250" height="210" rx="22" fill="#ffffff"/>
      <circle cx="45" cy="46" r="23" fill="#fef3c7"/>
      <text x="45" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#b45309">3</text>
      <text x="28" y="94" font-size="23" font-weight="700" fill="#0f172a">Statistical analysis</text>
      <text x="28" y="132" font-size="18" fill="#475569">ΔCq + effect sizes</text>
      <text x="28" y="163" font-size="18" fill="#475569">FDR + regression</text>
      <text x="28" y="194" font-size="18" fill="#475569">ROC evaluation</text>
    </g>

    <g transform="translate(991 120)">
      <rect width="250" height="210" rx="22" fill="#ffffff"/>
      <circle cx="45" cy="46" r="23" fill="#f3e8ff"/>
      <text x="45" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#7e22ce">4</text>
      <text x="28" y="94" font-size="23" font-weight="700" fill="#0f172a">Sensitivity checks</text>
      <text x="28" y="132" font-size="18" fill="#475569">QC exclusions</text>
      <text x="28" y="163" font-size="18" fill="#475569">Normalization checks</text>
      <text x="28" y="194" font-size="18" fill="#475569">Careful interpretation</text>
    </g>

    <g transform="translate(1304 120)">
      <rect width="244" height="210" rx="22" fill="#ffffff"/>
      <circle cx="45" cy="46" r="23" fill="#ffe4e6"/>
      <text x="45" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#be123c">5</text>
      <text x="28" y="94" font-size="23" font-weight="700" fill="#0f172a">Public outputs</text>
      <text x="28" y="132" font-size="18" fill="#475569">Tables + figures</text>
      <text x="28" y="163" font-size="18" fill="#475569">Methods narrative</text>
      <text x="28" y="194" font-size="18" fill="#475569">Synthetic data only</text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 313 225 L 351 225"/>
    <path d="M 626 225 L 664 225"/>
    <path d="M 939 225 L 977 225"/>
    <path d="M 1252 225 L 1290 225"/>
  </g>
</svg>
